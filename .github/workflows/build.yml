# Gera o WPSupportTools.exe no Windows a cada envio, e publica uma versão (Release) quando
# uma tag "v*" (ex.: v0.3.0) é criada. O .exe fica para download na página do GitHub.
name: Gerar WPSupportTools.exe

on:
  push:
    branches: [main, master, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Testes
        run: dotnet test WPSupportTools.sln -c Release

      - name: Gerar .exe
        run: dotnet publish src/WPSupportTools.App -p:PublishProfile=win-x64 -p:DebugType=none

      - uses: actions/upload-artifact@v4
        with:
          name: WPSupportTools
          path: publish/win-x64/WPSupportTools.exe

      - name: Publicar versão
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/win-x64/WPSupportTools.exe
