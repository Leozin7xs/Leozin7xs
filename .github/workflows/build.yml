# Gera o WPSupportTools.exe no Windows a cada envio e publica na página de versões (Releases),
# com o número de versão de Directory.Build.props (ex.: v0.3.0). Enquanto a versão não muda,
# cada envio substitui o .exe dessa mesma versão.
name: Gerar WPSupportTools.exe

on:
  push:
    branches: [main, master, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Testes
        run: dotnet test WPSupportTools.sln -c Release

      - name: Gerar .exe
        run: dotnet publish src/WPSupportTools.App -p:PublishProfile=win-x64 -p:DebugType=none

      - uses: actions/upload-artifact@v5
        with:
          name: WPSupportTools
          path: publish/win-x64/WPSupportTools.exe

      - name: Publicar versão
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          $tag = "v$version"
          $exe = "publish/win-x64/WPSupportTools.exe"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $exe --target $env:GITHUB_SHA --title "WP Support Tools $version" `
              --notes "Baixe o WPSupportTools.exe abaixo e dê dois cliques. Não precisa instalar nada."
          } else {
            gh release upload $tag $exe --clobber
          }
